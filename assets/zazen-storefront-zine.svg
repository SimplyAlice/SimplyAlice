<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="100%" role="img" aria-labelledby="zz-title zz-desc">
  <title id="zz-title">Zazen Matcha &amp; Tea Co. — Storefront &amp; Transactional Engine</title>
  <desc id="zz-desc">Split browser and SQL transaction diagram for Zazen Matcha &amp; Tea Co., an e-commerce project built with PHP 8, PDO, and MariaDB for Eduvos ITECA3-34.</desc>

  <defs>
    <pattern id="zz-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#F4B6D2" fill-opacity="0.16" />
    </pattern>
  </defs>

  <!-- Base Surface: Ink Black (#17171B) with Bubblegum Pink (#F4B6D2) border -->
  <rect x="4" y="4" width="912" height="292" rx="14" fill="#17171B" stroke="#F4B6D2" stroke-width="2" />
  <rect x="4" y="4" width="912" height="292" rx="14" fill="url(#zz-dots)" />

  <!-- Top Header Strip -->
  <rect x="24" y="22" width="212" height="24" rx="4" fill="#F4B6D2" />
  <text x="34" y="38" fill="#17171B" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="800" letter-spacing="0.8">BUILD 03 // ZAZEN MATCHA</text>

  <text x="250" y="38" fill="#FFFAF7" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill-opacity="0.85">
    PHP 8 · PDO · MariaDB / MySQL · CSS Grid · Vanilla JS · Alwaysdata SSL
  </text>

  <rect x="748" y="20" width="148" height="26" rx="5" fill="#23232B" stroke="#B9DFFF" stroke-opacity="0.6" stroke-width="1" />
  <text x="822" y="37" text-anchor="middle" fill="#B9DFFF" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="700">ITECA3-34 // DELIV 02</text>

  <!-- LEFT WINDOW: Editorial Storefront View (Warm White #FFFAF7 browser window) -->
  <rect x="24" y="62" width="424" height="212" rx="10" fill="#FFFAF7" stroke="#17171B" stroke-width="2" />
  <path d="M 24 72 Q 24 62 34 62 L 438 62 Q 448 62 448 72 L 448 90 L 24 90 Z" fill="#F4B6D2" />
  <circle cx="42" cy="76" r="4.5" fill="#17171B" />
  <circle cx="56" cy="76" r="4.5" fill="#17171B" fill-opacity="0.5" />
  <text x="74" y="80" fill="#17171B" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="800">zazen-matcha.alwaysdata.net/customer/</text>

  <!-- Storefront Typography & Chawan Bowl Illustration -->
  <text x="44" y="124" fill="#17171B" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700">Mindful Matcha. Every Day.</text>
  <text x="44" y="144" fill="#17171B" fill-opacity="0.78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">
    Ceremonial grade matcha, loose-leaf tea &amp; ceramic chawan sets.
  </text>

  <!-- Filter Pills -->
  <rect x="44" y="160" width="76" height="22" rx="11" fill="#17171B" />
  <text x="82" y="175" text-anchor="middle" fill="#FFFAF7" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="700">All Teas</text>

  <rect x="128" y="160" width="82" height="22" rx="11" fill="#B9DFFF" stroke="#17171B" stroke-width="1" />
  <text x="169" y="175" text-anchor="middle" fill="#17171B" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="700">Ceremonial</text>

  <rect x="218" y="160" width="68" height="22" rx="11" fill="#FFFAF7" stroke="#17171B" stroke-width="1" />
  <text x="252" y="175" text-anchor="middle" fill="#17171B" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="700">Teaware</text>

  <!-- Product Mini Cards -->
  <rect x="44" y="194" width="184" height="64" rx="6" fill="#17171B" />
  <text x="58" y="216" fill="#F4B6D2" font-family="Georgia, serif" font-size="13" font-weight="700">Uji First Harvest 30g</text>
  <text x="58" y="234" fill="#B9DFFF" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">stock_qty: verified ✓</text>
  <text x="58" y="248" fill="#FFFAF7" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700">Session Cart ──► Checkout</text>

  <rect x="240" y="194" width="188" height="64" rx="6" fill="#17171B" />
  <text x="254" y="216" fill="#B9DFFF" font-family="Georgia, serif" font-size="13" font-weight="700">Admin Store Console</text>
  <text x="254" y="234" fill="#FFFAF7" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">Catalogue CRUD · Metrics</text>
  <text x="254" y="248" fill="#F4B6D2" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700">/admin/ role-guarded</text>

  <!-- RIGHT WINDOW: Transactional Back-Office & PDO SQL Engine -->
  <rect x="472" y="62" width="424" height="212" rx="10" fill="#202027" stroke="#B9DFFF" stroke-width="1.5" />
  <path d="M 472 72 Q 472 62 482 62 L 886 62 Q 896 62 896 72 L 896 90 L 472 90 Z" fill="#2A2A34" />
  <text x="490" y="80" fill="#B9DFFF" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="700">includes/db.php · Transactional Checkout Flow</text>

  <text x="492" y="116" fill="#C8B5F5" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5">$pdo-&gt;beginTransaction();</text>
  <text x="492" y="138" fill="#B9DFFF" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5">// 1. Lock row &amp; revalidate live stock + price</text>
  <text x="492" y="158" fill="#FFFAF7" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5">SELECT price, stock FROM products</text>
  <text x="492" y="178" fill="#F4B6D2" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700">WHERE id = :id FOR UPDATE;</text>
  <text x="492" y="200" fill="#B9DFFF" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5">// 2. Insert order + decrement inventory</text>
  <text x="492" y="220" fill="#C8B5F5" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5">$pdo-&gt;commit();</text>

  <!-- Bottom Stamp in Right Window -->
  <rect x="492" y="234" width="384" height="26" rx="5" fill="#17171B" stroke="#F4B6D2" stroke-opacity="0.5" stroke-width="1" />
  <text x="506" y="251" fill="#FFFAF7" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">
    utf8mb4 schema · simulated card/EFT checkout · customer history
  </text>
</svg>
