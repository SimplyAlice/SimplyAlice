<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 118" width="100%" role="img" aria-labelledby="cs-title cs-desc">
  <title id="cs-title">Alice Matarise — Colophon &amp; Sign-Off</title>
  <desc id="cs-desc">Closing editorial stamp in ink black (#17171B), typewriter blue (#B9DFFF), bubblegum pink (#F4B6D2), and cherry pop (#FF5C74).</desc>

  <rect x="4" y="10" width="952" height="98" rx="16" fill="#17171B" stroke="#B9DFFF" stroke-width="2" />

  <!-- Rotated Warm White / Pink Stamp on Left -->
  <g transform="translate(26, 26) rotate(-1.6)">
    <rect x="4" y="4" width="186" height="62" rx="8" fill="#B9DFFF" />
    <rect x="0" y="0" width="186" height="62" rx="8" fill="#F4B6D2" stroke="#17171B" stroke-width="2" />
    <text x="93" y="26" text-anchor="middle" fill="#17171B" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="800" letter-spacing="1.2">SIGNED IN CAPE TOWN</text>
    <text x="93" y="47" text-anchor="middle" fill="#17171B" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="18" font-weight="700">Alice Matarise ✦</text>
  </g>

  <!-- Center Statement -->
  <text x="238" y="52" fill="#FFFAF7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="800" letter-spacing="-0.2">
    Still learning. Already shipping. Leaving things better than I found them.
  </text>
  <text x="238" y="77" fill="#B9DFFF" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" letter-spacing="0.4">
    EOF // BSc IT (Software Engineering) @ Eduvos · Graduating May 2027 · Cape Town, ZA
  </text>

  <!-- Right Cherry Pop Animated Star Badge -->
  <circle cx="910" cy="59" r="20" fill="#FF5C74" />
  <path d="M 910 45 Q 910 59 924 59 Q 910 59 910 73 Q 910 59 896 59 Q 910 59 910 45 Z" fill="#FFFAF7">
    <animateTransform attributeName="transform" type="rotate" from="0 910 59" to="360 910 59" dur="12s" repeatCount="indefinite" />
  </path>
</svg>
