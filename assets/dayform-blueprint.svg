<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" width="100%" role="img" aria-labelledby="df-title df-desc">
  <title id="df-title">Dayform — Cape Town Outing-Planning Blueprint</title>
  <desc id="df-desc">Technical diagram of Dayform showing natural-language intent parsed into verified Cape Town stops, travel buffers, Open-Meteo rain adaptation, and budget tracking.</desc>

  <defs>
    <pattern id="df-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#B9DFFF" stroke-width="0.6" stroke-opacity="0.1" />
    </pattern>
  </defs>

  <!-- Base Surface: Ink Black (#17171B) with Typewriter Blue (#B9DFFF) frame -->
  <rect x="4" y="4" width="912" height="302" rx="14" fill="#17171B" stroke="#B9DFFF" stroke-width="2" />
  <rect x="4" y="4" width="912" height="302" rx="14" fill="url(#df-grid)" />

  <!-- Top Header Strip -->
  <rect x="24" y="22" width="154" height="24" rx="4" fill="#B9DFFF" />
  <text x="34" y="38" fill="#17171B" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="800" letter-spacing="1">BUILD 01 // DAYFORM</text>

  <text x="192" y="38" fill="#FFFAF7" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill-opacity="0.85">
    React 18 · TypeScript · FastAPI · PostgreSQL · Redis · OpenStreetMap · Open-Meteo
  </text>

  <!-- Live Badge Top Right -->
  <rect x="786" y="20" width="110" height="26" rx="13" fill="#23232B" stroke="#FF5C74" stroke-width="1.5" />
  <circle cx="804" cy="33" r="4.5" fill="#FF5C74">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="816" y="37" fill="#FFFAF7" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="700">187 TESTS ✓</text>

  <!-- LEFT PANEL: Natural Language Prompt Cutout (Warm White #FFFAF7) -->
  <rect x="30" y="68" width="262" height="214" rx="10" fill="#F4B6D2" />
  <rect x="24" y="62" width="262" height="214" rx="10" fill="#FFFAF7" stroke="#17171B" stroke-width="2" />

  <text x="42" y="88" fill="#17171B" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="800" letter-spacing="0.8">01 / USER INTENTION</text>
  <line x1="42" y1="96" x2="268" y2="96" stroke="#17171B" stroke-opacity="0.2" stroke-width="1" />

  <text x="42" y="122" fill="#17171B" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15.5">
    “Cute birthday afternoon in
  </text>
  <text x="42" y="142" fill="#17171B" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15.5">
    Cape Town for 4 people, under
  </text>
  <text x="42" y="162" fill="#17171B" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15.5">
    R2,000, starting after lunch.”
  </text>

  <!-- Extracted Constraints Tags -->
  <rect x="42" y="182" width="102" height="22" rx="4" fill="#17171B" />
  <text x="50" y="197" fill="#B9DFFF" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700">party_size: 4</text>

  <rect x="152" y="182" width="114" height="22" rx="4" fill="#17171B" />
  <text x="160" y="197" fill="#F4B6D2" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700">max: R2,000</text>

  <rect x="42" y="210" width="224" height="22" rx="4" fill="#B9DFFF" stroke="#17171B" stroke-width="1" />
  <text x="50" y="225" fill="#17171B" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700">window: 13:30 ──► 19:45 SAST</text>

  <text x="42" y="256" fill="#17171B" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill-opacity="0.75">
    No rigid dropdowns. Deterministic math.
  </text>

  <!-- Connector Arrow from Left Panel to Route Canvas -->
  <path d="M 292 168 L 326 168" stroke="#B9DFFF" stroke-width="2" stroke-dasharray="4 3" />
  <polygon points="326,163 336,168 326,173" fill="#B9DFFF" />

  <!-- RIGHT PANEL: Deterministic Spatial & Temporal Sequence -->
  <rect x="340" y="62" width="556" height="218" rx="10" fill="#202027" stroke="#B9DFFF" stroke-opacity="0.45" stroke-width="1.5" />

  <text x="360" y="88" fill="#B9DFFF" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="0.8">
    02 / DETERMINISTIC ROUTE &amp; SCHEDULE ENGINE (OSM OVERPASS + OPEN-METEO)
  </text>

  <!-- Animated Route Curve across Cape Town Stops -->
  <path d="M 410 156 C 485 110, 540 198, 618 152 C 690 112, 745 190, 822 146" fill="none" stroke="#B9DFFF" stroke-opacity="0.3" stroke-width="4" />
  <path d="M 410 156 C 485 110, 540 198, 618 152 C 690 112, 745 190, 822 146" fill="none" stroke="#B9DFFF" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" values="24;0" dur="2.2s" repeatCount="indefinite" />
  </path>

  <!-- Stop 1 Node: City Bowl -->
  <circle cx="410" cy="156" r="10" fill="#17171B" stroke="#B9DFFF" stroke-width="3" />
  <circle cx="410" cy="156" r="4" fill="#B9DFFF" />
  <rect x="356" y="176" width="116" height="52" rx="6" fill="#17171B" stroke="#B9DFFF" stroke-opacity="0.5" stroke-width="1" />
  <text x="366" y="194" fill="#B9DFFF" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700">13:30 · CITY BOWL</text>
  <text x="366" y="209" fill="#FFFAF7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">Artisanal Lunch</text>
  <text x="366" y="222" fill="#F4B6D2" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">dwell: 90m · open ✓</text>

  <!-- Transit Pill 1 -->
  <rect x="480" y="114" width="68" height="20" rx="10" fill="#17171B" stroke="#C8B5F5" stroke-width="1" />
  <text x="514" y="128" text-anchor="middle" fill="#C8B5F5" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="700">+20m drive</text>

  <!-- Stop 2 Node: Newlands / Kirstenbosch -->
  <circle cx="618" cy="152" r="10" fill="#17171B" stroke="#F4B6D2" stroke-width="3" />
  <circle cx="618" cy="152" r="4" fill="#F4B6D2" />
  <rect x="556" y="176" width="126" height="52" rx="6" fill="#17171B" stroke="#F4B6D2" stroke-opacity="0.6" stroke-width="1" />
  <text x="566" y="194" fill="#F4B6D2" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700">15:20 · NEWLANDS</text>
  <text x="566" y="209" fill="#FFFAF7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">Canopy Walk</text>
  <text x="566" y="222" fill="#B9DFFF" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">dwell: 115m · dry ☀</text>

  <!-- Transit Pill 2 -->
  <rect x="688" y="114" width="68" height="20" rx="10" fill="#17171B" stroke="#C8B5F5" stroke-width="1" />
  <text x="722" y="128" text-anchor="middle" fill="#C8B5F5" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="700">+25m coast</text>

  <!-- Stop 3 Node: Clifton Golden Hour -->
  <circle cx="822" cy="146" r="10" fill="#17171B" stroke="#FF5C74" stroke-width="3" />
  <circle cx="822" cy="146" r="4" fill="#FF5C74" />
  <rect x="758" y="176" width="122" height="52" rx="6" fill="#17171B" stroke="#FF5C74" stroke-opacity="0.7" stroke-width="1" />
  <text x="768" y="194" fill="#FF5C74" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700">17:40 · CLIFTON</text>
  <text x="768" y="209" fill="#FFFAF7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">Sunset Drinks</text>
  <text x="768" y="222" fill="#B9DFFF" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">golden hour aligned</text>

  <!-- Bottom Execution & Budget Invariant Bar -->
  <rect x="356" y="240" width="524" height="28" rx="6" fill="#17171B" stroke="#B9DFFF" stroke-opacity="0.35" stroke-width="1" />
  <text x="370" y="258" fill="#B9DFFF" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="700">
    EST. SPEND: R1,650 (R350 headroom)
  </text>
  <text x="606" y="258" fill="#F4B6D2" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">
    • Google Maps coords • .ics export • non-destructive replan
  </text>
</svg>
