<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 58" width="100%" height="58" role="img" aria-labelledby="tw-title tw-desc">
  <title id="tw-title">Alice Matarise — Live TypeScript Status Ticker</title>
  <desc id="tw-desc">Animated typewriter bar in signature baby-blue (#B9DFFF) on ink black (#17171B), cycling through Alice Matarise's software engineering and cloud focus.</desc>

  <!-- Console Pill Background -->
  <rect x="2" y="2" width="956" height="54" rx="12" fill="#17171B" stroke="#B9DFFF" stroke-opacity="0.45" stroke-width="1.5" />

  <!-- Left Prompt Badge -->
  <rect x="14" y="11" width="176" height="36" rx="7" fill="#23232B" stroke="#F4B6D2" stroke-opacity="0.55" stroke-width="1" />
  <circle cx="30" cy="29" r="4.5" fill="#FF5C74">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
  </circle>
  <text x="44" y="33" fill="#F4B6D2" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="12" font-weight="700" letter-spacing="0.4">alice@cape-town:~$</text>

  <!-- Prompt Chevron -->
  <text x="204" y="34" fill="#C8B5F5" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="14" font-weight="700">❯</text>

  <!-- Line 1 (Default visible if animation is disabled) -->
  <g opacity="1">
    <animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;0.22;0.25;0.47;0.50;0.72;0.75;0.97;1" dur="16s" repeatCount="indefinite" />
    <text x="224" y="34" fill="#B9DFFF" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="13.5" font-weight="700" letter-spacing="0.2">
      export const alice = { focus: "Software &amp; Cloud", school: "Eduvos", city: "Cape Town" };
    </text>
  </g>

  <!-- Line 2 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;0.22;0.25;0.47;0.50;0.72;0.75;0.97;1" dur="16s" repeatCount="indefinite" />
    <text x="224" y="34" fill="#B9DFFF" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="13.5" font-weight="700" letter-spacing="0.2">
      shipped_builds ──► ["Dayform (Cape Town Outings)", "Zazen Matcha", "Career Connect"]
    </text>
  </g>

  <!-- Line 3 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;0.22;0.25;0.47;0.50;0.72;0.75;0.97;1" dur="16s" repeatCount="indefinite" />
    <text x="224" y="34" fill="#B9DFFF" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="13.5" font-weight="700" letter-spacing="0.2">
      exploring_next ──► Cloud Engineering · Cloud Support · Technical Operations
    </text>
  </g>

  <!-- Line 4 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" keyTimes="0;0.22;0.25;0.47;0.50;0.72;0.75;0.97;1" dur="16s" repeatCount="indefinite" />
    <text x="224" y="34" fill="#B9DFFF" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="13.5" font-weight="700" letter-spacing="0.2">
      "I build things. I break things. I figure out how they run in the real world."
    </text>
  </g>

  <!-- Blinking Bubblegum Pink Cursor at Right -->
  <rect x="928" y="19" width="10" height="20" rx="2" fill="#F4B6D2">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite" />
  </rect>
</svg>
