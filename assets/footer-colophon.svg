<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 110" width="100%" role="img" aria-labelledby="fc-title fc-desc">
  <title id="fc-title">Alice Matarise — Colophon &amp; Sign-Off</title>
  <desc id="fc-desc">Closing zine colophon banner in ink black (#17171B), typewriter blue (#B9DFFF), bubblegum pink (#F4B6D2), and cherry pop (#FF5C74).</desc>

  <!-- Main Pill Bar -->
  <rect x="4" y="8" width="912" height="94" rx="14" fill="#17171B" stroke="#B9DFFF" stroke-width="2" />

  <!-- Left Pink Sticker Stamp -->
  <g transform="translate(26, 26) rotate(-1.5)">
    <rect x="0" y="0" width="172" height="56" rx="8" fill="#F4B6D2" stroke="#17171B" stroke-width="1.5" />
    <text x="86" y="25" text-anchor="middle" fill="#17171B" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="800" letter-spacing="1">SIGNED IN CAPE TOWN</text>
    <text x="86" y="43" text-anchor="middle" fill="#17171B" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" font-weight="700">Alice Matarise ✦</text>
  </g>

  <!-- Center Statement -->
  <text x="224" y="48" fill="#FFFAF7" font-family="'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800">
    Still learning. Already shipping. Leaving things better than I found them.
  </text>
  <text x="224" y="72" fill="#B9DFFF" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" letter-spacing="0.5">
    EOF // BSc IT (Software Engineering) · Eduvos · Class of May 2027
  </text>

  <!-- Right Cherry Pop Punctuation Badge -->
  <circle cx="874" cy="55" r="18" fill="#FF5C74" />
  <path d="M 874 43 Q 874 55 886 55 Q 874 55 874 67 Q 874 55 862 55 Q 874 55 874 43 Z" fill="#FFFAF7">
    <animateTransform attributeName="transform" type="rotate" from="0 874 55" to="360 874 55" dur="14s" repeatCount="indefinite" />
  </path>
</svg>
