<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="100%" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Alice Matarise — Software Engineering Student, Builder &amp; Cloud Explorer</title>
  <desc id="hero-desc">Experimental digital scrapbook hero header for Alice Matarise, 23, BSc IT (Software Engineering) student at Eduvos in Cape Town. Features ink black, typewriter blue, and bubblegum pink window panels.</desc>

  <defs>
    <!-- Subtle pixel dot pattern -->
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#B9DFFF" fill-opacity="0.16" />
    </pattern>
    <!-- Fine technical grid -->
    <pattern id="line-grid" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M 96 0 L 0 0 0 96" fill="none" stroke="#B9DFFF" stroke-width="0.6" stroke-opacity="0.09" />
    </pattern>
    <!-- Diagonal hatching for cutout shadow -->
    <pattern id="pink-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#F4B6D2" stroke-width="2" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Outer Canvas: Ink Black (#17171B) -->
  <rect x="4" y="4" width="912" height="382" rx="16" fill="#17171B" stroke="#17171B" stroke-width="2" />
  <rect x="4" y="4" width="912" height="382" rx="16" fill="url(#line-grid)" />
  <rect x="4" y="4" width="912" height="382" rx="16" fill="url(#dot-grid)" />

  <!-- Top Browser / OS Window Bar -->
  <path d="M 4 20 Q 4 4 20 4 L 900 4 Q 916 4 916 20 L 916 44 L 4 44 Z" fill="#202026" />
  <line x1="4" y1="44" x2="916" y2="44" stroke="#B9DFFF" stroke-opacity="0.22" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="28" cy="24" r="6" fill="#FF5C74" />
  <circle cx="48" cy="24" r="6" fill="#F4B6D2" />
  <circle cx="68" cy="24" r="6" fill="#B9DFFF" />

  <!-- Address / Tab Bar -->
  <rect x="96" y="12" width="380" height="24" rx="6" fill="#17171B" stroke="#B9DFFF" stroke-opacity="0.28" stroke-width="1" />
  <text x="112" y="28" fill="#B9DFFF" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11.5" letter-spacing="0.5">alice://cape-town/lab-notebook.tsx</text>

  <!-- Top-Right Telemetry Tag -->
  <circle cx="718" cy="24" r="4" fill="#FF5C74">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite" />
  </circle>
  <text x="730" y="28" fill="#FFFAF7" fill-opacity="0.8" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11" letter-spacing="1">33.9249° S, 18.4241° E</text>

  <!-- Offset Hatch Shadow behind Main Zine Cutout -->
  <rect x="44" y="76" width="546" height="278" rx="12" fill="url(#pink-hatch)" />
  <rect x="44" y="76" width="546" height="278" rx="12" fill="none" stroke="#F4B6D2" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Main Zine Cutout Panel (Dark surface with crisp Typewriter Blue border) -->
  <rect x="34" y="66" width="546" height="278" rx="12" fill="#17171B" stroke="#B9DFFF" stroke-width="2" />

  <!-- Small Top Annotation Inside Panel -->
  <rect x="56" y="88" width="168" height="24" rx="4" fill="#B9DFFF" />
  <text x="67" y="104" fill="#17171B" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.2">ISSUE 23 // VOL. 04</text>

  <text x="238" y="104" fill="#F4B6D2" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11.5" letter-spacing="0.6">BSc IT (Software Engineering) @ Eduvos</text>

  <!-- Oversized Display Identity -->
  <text x="54" y="176" fill="#FFFAF7" font-family="'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="900" letter-spacing="-1.5">ALICE</text>

  <!-- Expressive Serif Accent Word next to ALICE -->
  <text x="278" y="174" fill="#F4B6D2" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="28" font-weight="400">builds &amp; breaks</text>

  <!-- Second Line Display Identity in Signature Typewriter Blue with Ink Offset -->
  <text x="57" y="243" fill="#FF5C74" font-family="'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="900" letter-spacing="-1">MATARISE</text>
  <text x="54" y="240" fill="#B9DFFF" font-family="'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="900" letter-spacing="-1">MATARISE</text>

  <!-- Editorial Statement Strip -->
  <rect x="56" y="264" width="496" height="1.5" fill="#B9DFFF" fill-opacity="0.25" />
  <text x="56" y="292" fill="#FFFAF7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">
    Software, cloud, and ideas I couldn't leave alone.
  </text>
  <text x="56" y="316" fill="#B9DFFF" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12" letter-spacing="0.4">
    [status: work in progress — in the best way]
  </text>

  <!-- RIGHT SIDE: Asymmetric Scrapbook / Inspector Stack -->

  <!-- Card 1: Warm White (#FFFAF7) Cutout Note (Rotated slightly via path/transform) -->
  <g transform="translate(612, 72) rotate(1.8)">
    <!-- Solid shadow -->
    <rect x="6" y="6" width="268" height="148" rx="10" fill="#F4B6D2" />
    <!-- Warm White card body -->
    <rect x="0" y="0" width="268" height="148" rx="10" fill="#FFFAF7" stroke="#17171B" stroke-width="2.5" />
    <!-- Lilac tape strip at top center -->
    <rect x="92" y="-10" width="84" height="20" rx="3" fill="#C8B5F5" stroke="#17171B" stroke-width="1.5" />
    <text x="134" y="4" text-anchor="middle" fill="#17171B" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="1">FIELD NOTE</text>

    <text x="20" y="36" fill="#17171B" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" letter-spacing="0.8">// CURRENTLY IN THE LAB</text>
    <line x1="20" y1="44" x2="248" y2="44" stroke="#17171B" stroke-width="1" stroke-opacity="0.2" />

    <text x="20" y="68" fill="#17171B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700">• Shipping full-stack web apps</text>
    <text x="20" y="90" fill="#17171B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700">• Exploring Azure &amp; cloud ops</text>
    <text x="20" y="112" fill="#17171B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700">• Final-year BSc IT (May 2027)</text>

    <rect x="20" y="122" width="142" height="18" rx="4" fill="#17171B" />
    <text x="28" y="135" fill="#B9DFFF" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700">CAPE TOWN, ZA ✦ 23</text>
  </g>

  <!-- Card 2: Bottom Right Mini Code / TypeScript Sticker Window -->
  <g transform="translate(604, 244) rotate(-1.2)">
    <rect x="6" y="6" width="276" height="106" rx="10" fill="#B9DFFF" />
    <rect x="0" y="0" width="276" height="106" rx="10" fill="#17171B" stroke="#F4B6D2" stroke-width="2" />
    <rect x="0" y="0" width="276" height="24" rx="10" fill="#F4B6D2" />
    <rect x="0" y="14" width="276" height="10" fill="#F4B6D2" />
    <text x="14" y="16" fill="#17171B" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="800" letter-spacing="0.8">identity.ts — TypeScript</text>
    <circle cx="258" cy="12" r="4" fill="#17171B" />

    <text x="16" y="46" fill="#C8B5F5" font-family="'JetBrains Mono', Consolas, monospace" font-size="12">type</text>
    <text x="52" y="46" fill="#B9DFFF" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700">Focus</text>
    <text x="96" y="46" fill="#FFFAF7" font-family="'JetBrains Mono', Consolas, monospace" font-size="12">= [</text>
    <text x="28" y="66" fill="#F4B6D2" font-family="'JetBrains Mono', Consolas, monospace" font-size="12">"software"</text>
    <text x="102" y="66" fill="#FFFAF7" font-family="'JetBrains Mono', Consolas, monospace" font-size="12">,</text>
    <text x="114" y="66" fill="#B9DFFF" font-family="'JetBrains Mono', Consolas, monospace" font-size="12">"cloud"</text>
    <text x="166" y="66" fill="#FFFAF7" font-family="'JetBrains Mono', Consolas, monospace" font-size="12">,</text>
    <text x="28" y="86" fill="#FFFAF7" font-family="'JetBrains Mono', Consolas, monospace" font-size="12">"things that run"</text>
    <text x="156" y="86" fill="#FFFAF7" font-family="'JetBrains Mono', Consolas, monospace" font-size="12">];</text>
  </g>

  <!-- Decorative 4-Point Sparkle Stars & Cursor Motif -->
  <!-- Star 1: Top middle-right (Bubblegum Pink) -->
  <path d="M 580 58 Q 580 72 594 72 Q 580 72 580 86 Q 580 72 566 72 Q 580 72 580 58 Z" fill="#F4B6D2">
    <animateTransform attributeName="transform" type="scale" values="1;1.12;1" additive="sum" dur="3.2s" repeatCount="indefinite" />
  </path>

  <!-- Star 2: Bottom middle-right (Cherry Pop punctuation) -->
  <path d="M 564 332 Q 564 342 574 342 Q 564 342 564 352 Q 564 342 554 342 Q 564 342 564 332 Z" fill="#FF5C74" />

  <!-- Pointer Cursor Motif near MATARISE -->
  <g transform="translate(412, 214)">
    <path d="M 0 0 L 0 22 L 6 17 L 11 26 L 15 24 L 10 15 L 18 15 Z" fill="#FFFAF7" stroke="#17171B" stroke-width="1.5" />
    <rect x="16" y="22" width="58" height="18" rx="4" fill="#FF5C74" />
    <text x="23" y="34" fill="#FFFAF7" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700">alice.me</text>
  </g>
</svg>
